<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citka DL — Personal Media Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card: #121216;
            --border: #27272a;
            --primary: #e11d48;
            --primary-hover: #be123c;
            --text: #fafafa;
            --muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.15), transparent 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(225, 29, 72, 0.12);
            color: #fb7185;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 99px;
            border: 1px solid rgba(225, 29, 72, 0.25);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 span { color: var(--primary); }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            background: #18181b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 70px 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .paste-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #27272a;
            color: var(--text);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .paste-btn:hover { background: #3f3f46; }

        .format-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .format-option {
            position: relative;
        }

        .format-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .format-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .format-option input:checked + .format-card {
            border-color: var(--primary);
            background: rgba(225, 29, 72, 0.08);
        }

        .format-title {
            font-weight: 700;
            font-size: 15px;
        }

        .format-desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover { background: var(--primary-hover); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .status {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            color: var(--muted);
            display: none;
        }

        .status.error { color: #f87171; display: block; }
        .status.loading { color: #38bdf8; display: block; }
        .status.success { color: #4ade80; display: block; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #52525b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="badge">PRIVATE ENGINE</div>
        <h1>Citka<span>DL</span></h1>
        <p class="subtitle">วางลิงก์แล้วเลือกรูปแบบไฟล์ที่ต้องการ</p>
    </div>

    <form id="dlForm">
        <div class="input-group">
            <input type="text" id="urlInput" name="url" placeholder="https://youtube.com/watch?v=..." required>
            <button type="button" class="paste-btn" onclick="pasteUrl()">วางลิงก์</button>
        </div>

        <div class="format-grid">
            <label class="format-option">
                <input type="radio" name="type" value="mp4" checked>
                <div class="format-card">
                    <span class="format-title">🎬 MP4</span>
                    <span class="format-desc">วิดีโอความชัดสูงสุด</span>
                </div>
            </label>

            <label class="format-option">
                <input type="radio" name="type" value="mp3">
                <div class="format-card">
                    <span class="format-title">🎵 MP3</span>
                    <span class="format-desc">เสียงคุณภาพ 192kbps</span>
                </div>
            </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">ดาวน์โหลดไฟล์</span>
        </button>
    </form>

    <div class="status" id="statusMsg"></div>

    <div class="footer">
        Powered by Citka • Personal Use Only
    </div>
</div>

<script>
    async function pasteUrl() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('urlInput').value = text;
        } catch (err) {
            alert('เบราว์เซอร์ไม่อนุญาตให้วางอัตโนมัติ กดค้างแล้วกดวางในช่องได้เลยครับ');
        }
    }

    document.getElementById('dlForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const statusMsg = document.getElementById('statusMsg');
        const formData = new FormData(this);

        // เปลี่ยนสถานะเป็นกำลังโหลด
        btn.disabled = true;
        spinner.style.display = 'block';
        btnText.textContent = 'กำลังดึงข้อมูลและแปลงไฟล์...';
        statusMsg.className = 'status loading';
        statusMsg.textContent = 'อาจใช้เวลา 5-20 วินาที ขึ้นอยู่กับความยาวคลิปครับ';

        try {
            const response = await fetch('/download', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'เกิดข้อผิดพลาดในการดาวน์โหลด');
            }

            // ดึงชื่อไฟล์จาก Header
            const disposition = response.headers.get('Content-Disposition');
            let filename = 'citka_media.' + formData.get('type');
            if (disposition && disposition.includes('filename=')) {
                const match = disposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)["']?/i);
                if (match && match[1]) {
                    filename = decodeURIComponent(match[1]);
                }
            }

            // สร้างลิงก์ดาวน์โหลดอัตโนมัติ
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            statusMsg.className = 'status success';
            statusMsg.textContent = 'ดาวน์โหลดเสร็จเรียบร้อย!';
        } catch (error) {
            statusMsg.className = 'status error';
            statusMsg.textContent = error.message;
        } finally {
            btn.disabled = false;
            spinner.style.display = 'none';
            btnText.textContent = 'ดาวน์โหลดไฟล์';
        }
    });
</script>

</body>
</html>
